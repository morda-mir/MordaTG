name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string
      changelog:
        description: "Visible release notes"
        required: true
        type: string
      minimum_supported_version:
        description: "Minimum supported versionCode"
        required: true
        default: "1"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          mkdir -p .secrets
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .secrets/mordatg-release.jks
          {
            echo "storeFile=.secrets/mordatg-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > release-signing.properties

      - name: Test, lint and build signed release
        env:
          RELEASE_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/update.json
        run: |
          ./gradlew testDebugUnitTest lintRelease :app:assembleRelease \
            -PmordatgUpdateEndpoint="$RELEASE_ENDPOINT"

      - name: Prepare release assets
        id: release_meta
        env:
          INPUT_CHANGELOG: ${{ inputs.changelog }}
          INPUT_MINIMUM: ${{ inputs.minimum_supported_version }}
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk release-assets/MordaTG.apk
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          SHA256=$(sha256sum release-assets/MordaTG.apk | cut -d' ' -f1)
          PUBLISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          CHANGELOG="${INPUT_CHANGELOG:-Первый выпуск.}"
          MINIMUM=${INPUT_MINIMUM:-1}
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/MordaTG.apk"
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "$APK_URL" \
            --arg changelog "$CHANGELOG" \
            --arg sha256 "$SHA256" \
            --arg publishedAt "$PUBLISHED_AT" \
            --argjson minimumSupportedVersion "$MINIMUM" \
            '{versionCode:$versionCode,versionName:$versionName,apkUrl:$apkUrl,changelog:$changelog,sha256:$sha256,publishedAt:$publishedAt,minimumSupportedVersion:$minimumSupportedVersion}' \
            > release-assets/update.json
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: MordaTG ${{ steps.release_meta.outputs.version_name }}
          generate_release_notes: false
          body: ${{ inputs.changelog || 'Первый выпуск.' }}
          files: |
            release-assets/MordaTG.apk
            release-assets/update.json
